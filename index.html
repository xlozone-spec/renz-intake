<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Your Style Guide</title>
<link rel="preload" href="is400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="intake.css">
</head><body>
<div id="rz-intake"></div>
<script>
window.RZ_INTAKE={
  testMode:false,
  apiBase:'https://script.google.com/macros/s/AKfycbyfJiYpelClHbWqUvnHjFLb-lyHJwIjfBLJgAOb1bptePHt_7gDNHSv_1AQs-BtaN2v/exec',  // Apps Script web app
  scanUrl:'',        // set on the server (SCAN_URL)
  imgBase:'img/',
  looksBase:'img/looks/',
  exampleBase:'img/examples/',
  showPrivacy:false  // only once Esenca confirms scan photos are deleted
};
</script>
<script src="intake.js"></script>
<!-- RENZ · INTAKE COMPLETION WEBHOOK (v2 from Frank, 13 Oct 2026)
     Watches for the final "scan" section post from intake.js and tells the CRM.
     Wraps window.fetch only; never changes intake behaviour; failures are swallowed. -->
<script>
(function () {
  var HOOK = 'https://services.leadconnectorhq.com/hooks/qfdtcX0EE0FhMFVxCLPq/webhook-trigger/5f35986a-356e-4f0d-8c2f-9302dbc86a78';
  var FINAL_SECTION = 'scan';
  var email = '';
  var fired = false;

  try { email = localStorage.getItem('rz_intake_email') || ''; } catch (e) {}

  var realFetch = window.fetch;
  window.fetch = function (input, init) {
    var body = null;
    try { body = (init && init.body) || (input && input.body) || null; } catch (e) {}

    var data = null;
    if (typeof body === 'string' && body.charAt(0) === '{') {
      try { data = JSON.parse(body); } catch (e) {}
    }

    if (data) {
      if (data.action === 'login' && data.email) {
        email = String(data.email).trim();
        try { localStorage.setItem('rz_intake_email', email); } catch (e) {}
      }

      if (!fired && data.action === 'section' && data.section === FINAL_SECTION) {
        fired = true;
        try {
          var token = data.token || '';
          realFetch(HOOK, {
            method: 'POST',
            keepalive: true,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              event: 'intake_complete',
              email: email,
              contact_id: token ? token.slice(0, token.lastIndexOf('.')) : '',
              completed_at: new Date().toISOString(),
              source: 'intake.lorenzosegor.com'
            })
          })['catch'](function () {});
        } catch (e) {}
      }
    }

    return realFetch.apply(this, arguments);
  };
})();
</script>
</body></html>
